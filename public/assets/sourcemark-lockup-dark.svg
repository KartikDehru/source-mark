<svg width="556" height="160" viewBox="52 38 556 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SourceMark">
  <title>SourceMark</title>

  <!-- Dark-theme lockup for the inverted panels. Same artwork as the original
       dark logo but with no background plate, so it can sit on any dark surface
       without a visible seam where two near-blacks meet. -->

  <polygon points="120,50 180.6,85 180.6,155 120,190 59.4,155 59.4,85"
           fill="none" stroke="#2FE6A6" stroke-width="6" stroke-linejoin="round"/>

  <line x1="120" y1="120" x2="120" y2="50"
        stroke="#2FE6A6" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <circle cx="120" cy="50" r="9" fill="#2FE6A6"/>
  <circle cx="120" cy="120" r="6" fill="#5B6472"/>

  <text x="260" y="145" font-family="'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.2">
    <tspan fill="#F0F2F4">source</tspan><tspan fill="#2FE6A6">mark</tspan>
  </text>
</svg>
