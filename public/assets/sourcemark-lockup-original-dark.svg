<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="240" fill="#0B0D10"/>

  <!-- Icon: hexagonal "field" with a single verified source marked -->
  <g transform="translate(0,0)">
    <polygon points="120,50 180.6,85 180.6,155 120,190 59.4,155 59.4,85"
             fill="none" stroke="#2FE6A6" stroke-width="6"
             stroke-linejoin="round"/>

    <!-- trace from center to the one verified vertex -->
    <line x1="120" y1="120" x2="120" y2="50"
          stroke="#2FE6A6" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <!-- the mark itself: the verified source point -->
    <circle cx="120" cy="50" r="9" fill="#2FE6A6"/>

    <!-- center reference point (the query origin) -->
    <circle cx="120" cy="120" r="6" fill="#5B6472"/>
  </g>

  <!-- Wordmark -->
  <text x="260" y="145" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="60" font-weight="600" letter-spacing="1">
    <tspan fill="#C7CDD6">source</tspan><tspan fill="#2FE6A6">mark</tspan>
  </text>
</svg>
