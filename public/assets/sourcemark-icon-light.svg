<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SourceMark">
  <title>SourceMark</title>

  <!-- Light-theme icon: transparent ground so it sits on paper or on a tinted
       panel. Stroke weights are a touch heavier than the lockup's because this
       is the favicon and gets rasterised at 16px. -->

  <polygon points="120,50 180.6,85 180.6,155 120,190 59.4,155 59.4,85"
           fill="none" stroke="#13161C" stroke-width="7" stroke-linejoin="round"/>

  <line x1="120" y1="120" x2="120" y2="50"
        stroke="#13161C" stroke-width="5" stroke-linecap="round" opacity="0.34"/>

  <circle cx="120" cy="50" r="10" fill="#2FE6A6" stroke="#13161C" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="7" fill="#A8ABAE"/>
</svg>
