<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SourceMark">
  <title>SourceMark</title>
  <!-- Light-theme icon: geometric fountain-pen nib = the "mark". -->
  <g transform="translate(120 128) rotate(-38)">
    <!-- nib body -->
    <path d="M0 -78 L34 18 Q36 42 0 68 Q-36 42 -34 18 Z"
          fill="#13161C"/>
    <!-- center slit -->
    <path d="M0 -62 L0 52" fill="none" stroke="#F6F7F7" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <!-- ink well -->
    <ellipse cx="0" cy="8" rx="11" ry="15" fill="#2FE6A6"/>
    <!-- mint tip -->
    <path d="M0 -78 L14 -44 L0 -52 L-14 -44 Z" fill="#2FE6A6"/>
  </g>
</svg>
